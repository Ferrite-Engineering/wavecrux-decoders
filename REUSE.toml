version = 1
SPDX-PackageName = "wavecrux-decoders"
SPDX-PackageSupplier = "Ferrite Engineering LLC <support@ferriteengineering.com>"
SPDX-PackageDownloadLocation = "https://github.com/Ferrite-Engineering/wavecrux-decoders"

# Files that cannot carry an SPDX header (data, configuration, documentation)
# are Apache-2.0 unless a more specific annotation below says otherwise.
[[annotations]]
path = [
    "**/*.md",
    "**/*.json",
    "**/*.vcd",
    "**/*.seed",
    "decoders/*/stimulus/*.hex",
    "decoders/*/stimulus/*.txt",
    "**/*.toml",
    "**/VERSION",
    "**/regressions/**",
    "**/corpus/**",
    ".github/**",
    ".clang-format",
    ".clang-tidy",
    ".editorconfig",
    ".gitattributes",
    ".gitignore",
    "NOTICE",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Ferrite Engineering LLC"
SPDX-License-Identifier = "Apache-2.0"

# The WaveCrux plugin ABI header, vendored byte for byte from the open core
# (which is Apache-2.0); it cannot carry our header without drifting.
[[annotations]]
path = ["include/wavecrux_decoder.h"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Ferrite Engineering LLC"
SPDX-License-Identifier = "Apache-2.0"

# Captured waveforms are produced by the openCologne-PCIE testbench and RTL
# and keep its BSD-3-Clause licence and notice (see PROVENANCE.md). Our
# bindings, expectations and provenance notes next to them stay Apache-2.0.
[[annotations]]
path = ["decoders/pcie/fixtures/captured/**/*.vcd"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Chili.CHIPS*ba"
SPDX-License-Identifier = "BSD-3-Clause"

# The PCIe TLP decoder is Chili.CHIPS's (CODEOWNERS): its files without an
# SPDX header (documentation, metadata, fixtures, fuzz seeds) name them, not
# Ferrite. Its C and Python files carry their own headers.
[[annotations]]
path = [
    "decoders/pcie-tlp/**/*.md",
    "decoders/pcie-tlp/**/*.json",
    "decoders/pcie-tlp/**/*.vcd",
    "decoders/pcie-tlp/**/*.seed",
    "decoders/pcie-tlp/VERSION",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 Chili.CHIPS"
SPDX-License-Identifier = "Apache-2.0"

# Captured waveforms of the PCIe TLP decoder come from openPCIE's
# co-simulation and keep its BSD-3-Clause licence and notice (see
# decoders/pcie-tlp/fixtures/captured/PROVENANCE.md).
[[annotations]]
path = ["decoders/pcie-tlp/fixtures/captured/**/*.vcd"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Chili.CHIPS"
SPDX-License-Identifier = "BSD-3-Clause"

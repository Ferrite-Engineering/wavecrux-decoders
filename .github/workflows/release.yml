# Copyright 2026 Ferrite Engineering LLC
#
# One plugin, one version, all three platforms (operations standard §4).
# Triggered only by a tag <plugin>-v<semver>. Every platform builds from the
# tag, runs the full test suite, is signed where the platform has signing,
# and is packaged; then one job checksums everything, writes the catalog
# entry and creates the GitHub Release.
#
# Each archive ships the plugin library and wcxhost, the host emulator, from
# the same build: both are signed (and on macOS notarized) together, and on
# Linux both are held to the glibc floor.
#
# Signing uses the same secret and variable names as WaveCrux's own desktop
# release. If any platform could not be signed because its signing secrets are
# not configured, the release is created as a DRAFT: an unsigned macOS library
# will not load in notarized WaveCrux, so nothing unsigned is published by
# accident.

name: Release

on:
  push:
    tags: ["*-v[0-9]*"]
  # Dry run: build, test, sign and notarize an existing tag on all three
  # platforms and keep the archives as workflow artifacts. Publishes nothing.
  # `ref` builds another commit under that tag's name instead, to try a change
  # to the release tooling (this workflow, tools/, CMake) before it is merged;
  # the tag names the plugin, and that commit's VERSION must still match it.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to dry-run, e.g. pcie-v0.1.0"
        required: true
        type: string
      ref:
        description: "Optional: branch or commit to build instead of the tag's source"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux_x64
            os: ubuntu-22.04 # pinned: glibc floor
            preset: ci-linux-gcc
          - platform: windows_x64
            os: windows-latest
            preset: ci-windows-msvc
          - platform: macos_universal
            os: macos-latest
            preset: ci-macos-universal
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      SOURCE_DATE_EPOCH: "1767225600" # 2026-01-01T00:00:00Z, for reproducible archives and binaries
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || inputs.tag || github.ref }}

      # The tag names the plugin directory (decoders/pcie-tlp for
      # pcie-tlp-v0.1.0); the library's file name comes from its plugin.json
      # (`library`: wcx_pcie_tlp), never from the tag.
      - name: Plugin from the tag
        id: tag
        shell: bash
        run: |
          tag="${RELEASE_TAG}"
          plugin="${tag%-v*}"
          [ -f "decoders/$plugin/plugin.json" ] || { echo "::error::no decoders/$plugin/plugin.json for tag $tag"; exit 1; }
          library=$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["library"])' "decoders/$plugin/plugin.json")
          [[ "$library" =~ ^wcx_[a-z0-9_]+$ ]] || { echo "::error::decoders/$plugin/plugin.json: library '$library' is not wcx_<lower_snake_case>"; exit 1; }
          case "$RUNNER_OS" in
            Windows) lib_file="$library.dll" ;;
            macOS)   lib_file="lib$library.dylib" ;;
            *)       lib_file="lib$library.so" ;;
          esac
          echo "plugin=$plugin" >> "$GITHUB_OUTPUT"
          echo "lib_file=$lib_file" >> "$GITHUB_OUTPUT"

      - name: Toolchain (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y gcc-13 ninja-build
      - name: Toolchain (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja
      - name: Toolchain (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: Configure
        shell: bash
        run: |
          extra=()
          [ "$RUNNER_OS" = "Linux" ] && extra+=(-DCMAKE_C_COMPILER=gcc-13)
          cmake --preset ${{ matrix.preset }} "${extra[@]}"
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test (the full suite gates the release)
        run: ctest --preset ${{ matrix.preset }} --output-on-failure
      - name: The library plugin.json names was built
        shell: bash
        run: |
          lib="build/${{ matrix.preset }}/plugins/${{ steps.tag.outputs.lib_file }}"
          [ -f "$lib" ] || { echo "::error::$lib was not built; plugin.json 'library' must match wcx_add_decoder(NAME)"; exit 1; }

      - name: glibc floor (plugin and wcxhost)
        if: runner.os == 'Linux'
        run: |
          python3 tools/check_glibc.py --max 2.35 \
            build/${{ matrix.preset }}/plugins/${{ steps.tag.outputs.lib_file }} \
            build/${{ matrix.preset }}/bin/wcxhost

      # ── macOS: Developer ID, hardened runtime, notarization ──────────────
      - name: Sign (macOS)
        id: sign_macos
        if: runner.os == 'macOS'
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          lib=build/${{ matrix.preset }}/plugins/${{ steps.tag.outputs.lib_file }}
          host=build/${{ matrix.preset }}/bin/wcxhost
          if [ -z "$MACOS_CERT_P12_BASE64" ]; then
            echo "::warning::macOS signing secrets are not configured; the release will be a draft"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          kc_pass=$(openssl rand -hex 16)
          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$kc_pass" "$keychain"
          security set-keychain-settings -lut 900 "$keychain"
          security unlock-keychain -p "$kc_pass" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security list-keychains -d user -s "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kc_pass" "$keychain" > /dev/null
          identity="Developer ID Application: Ferrite Engineering LLC (7957R7M965)"
          codesign --force --timestamp --options runtime --sign "$identity" "$lib"
          # wcxhost exists to load plugins, including ones a user builds
          # (ad-hoc signed), so its hardened runtime turns library validation
          # off. Nothing else is relaxed.
          entitlements="$RUNNER_TEMP/wcxhost.entitlements"
          cat > "$entitlements" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>com.apple.security.cs.disable-library-validation</key>
              <true/>
          </dict>
          </plist>
          PLIST
          codesign --force --timestamp --options runtime --entitlements "$entitlements" \
            --sign "$identity" "$host"
          codesign --verify --strict --verbose=2 "$lib"
          codesign --verify --strict --verbose=2 "$host"
          # One submission for both binaries.
          mkdir "$RUNNER_TEMP/notarize"
          cp "$lib" "$host" "$RUNNER_TEMP/notarize/"
          ditto -c -k --keepParent "$RUNNER_TEMP/notarize" "$RUNNER_TEMP/notarize.zip"
          out=$(xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --apple-id "$NOTARY_APPLE_ID" \
            --team-id 7957R7M965 --password "$NOTARY_PASSWORD" --wait 2>&1) || true
          echo "$out"
          # Check the outcome, not the exit code: an Invalid submission is a
          # completed submission.
          echo "$out" | grep -q "status: Accepted" || { echo "::error::notarization was not accepted"; exit 1; }
          # A bare Mach-O file cannot have a ticket stapled; Gatekeeper looks
          # the ticket up online. Show its verdict for the record.
          spctl -a -vv -t open --context context:primary-signature "$lib" || true
          spctl -a -vv -t open --context context:primary-signature "$host" || true
          echo "signed=true" >> "$GITHUB_OUTPUT"

      # ── Windows: Authenticode through Azure Trusted Signing ──────────────
      - name: Stage DLL and wcxhost.exe for signing (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p to-sign
          cp build/${{ matrix.preset }}/plugins/${{ steps.tag.outputs.lib_file }} to-sign/
          cp build/${{ matrix.preset }}/bin/wcxhost.exe to-sign/
      - name: Sign (Windows)
        if: runner.os == 'Windows' && vars.AZURE_TS_ENDPOINT != ''
        uses: azure/trusted-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.AZURE_TS_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.AZURE_TS_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_TS_PROFILE }}
          files-folder: to-sign
          files-folder-filter: dll,exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Verify the signatures (Windows)
        if: runner.os == 'Windows' && vars.AZURE_TS_ENDPOINT != ''
        shell: pwsh
        run: |
          foreach ($file in Get-ChildItem to-sign -Include *.dll, *.exe -Recurse) {
            $sig = Get-AuthenticodeSignature $file.FullName
            "$($file.Name): $($sig.Status), signer $($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne 'Valid') { throw "$($file.Name): signature is $($sig.Status)" }
          }

      # The binaries that ship, after signing: wcxhost loads the plugin, and
      # (on macOS, through its entitlement) a plugin signed by someone else.
      - name: Smoke-test the shipped wcxhost
        shell: bash
        run: |
          build="build/${{ matrix.preset }}"
          lib_file="${{ steps.tag.outputs.lib_file }}"
          case "$RUNNER_OS" in
            Windows) host=to-sign/wcxhost.exe; lib="to-sign/$lib_file"; echo_lib="$build/plugins/wcx_test_echo.dll" ;;
            macOS)   host="$build/bin/wcxhost"; lib="$build/plugins/$lib_file"; echo_lib="$build/plugins/libwcx_test_echo.dylib" ;;
            *)       host="$build/bin/wcxhost"; lib="$build/plugins/$lib_file"; echo_lib="$build/plugins/libwcx_test_echo.so" ;;
          esac
          "$host" --plugin "$lib" --list
          "$host" --plugin "$echo_lib" --list

      - name: Package
        shell: bash
        run: |
          build="build/${{ matrix.preset }}"
          if [ "$RUNNER_OS" = "Windows" ]; then build="to-sign"; fi
          python3 tools/release.py package --plugin ${{ steps.tag.outputs.plugin }} \
            --platform ${{ matrix.platform }} --build-dir "$build" --out dist
          signed=true
          if [ "$RUNNER_OS" = "macOS" ] && [ "${{ steps.sign_macos.outputs.signed }}" != "true" ]; then signed=false; fi
          if [ "$RUNNER_OS" = "Windows" ] && [ -z "${{ vars.AZURE_TS_ENDPOINT }}" ]; then signed=false; fi
          echo "$signed" > "dist/${{ matrix.platform }}.signed"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ matrix.platform }}
          path: dist/
          if-no-files-found: error

  publish:
    name: Checksums, catalog, GitHub Release
    needs: build
    if: github.event_name == 'push' # a dry run never publishes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write # build-provenance attestation (OIDC)
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Finalize
        run: |
          tag="${GITHUB_REF_NAME}"
          python3 tools/release.py finalize --plugin "${tag%-v*}" --tag "$tag" --dist dist --repo "$GITHUB_REPOSITORY"
      # Build provenance (operations standard §4). GitHub offers attestations
      # only to public repositories on the current plan, so the step is
      # skipped while the repository is private.
      - name: Attest build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.zip
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          draft=""
          if grep -l false dist/*.signed > /dev/null 2>&1; then
            draft="--draft"
            echo "::warning::at least one platform is unsigned; creating a DRAFT release"
          fi
          prerelease=""
          case "$tag" in *-v0.*) prerelease="--prerelease" ;; esac
          gh release create "$tag" $draft $prerelease --title "$tag" \
            --notes-file dist/RELEASE_NOTES.md \
            dist/*.zip dist/SHA256SUMS dist/catalog.json

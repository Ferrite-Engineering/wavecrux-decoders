#
# Sign the Windows library of an already-published release, without
# rebuilding it: for a release that was cut before the repository's signing
# secrets existed. Downloads the release's Windows archive, signs the DLL
# (and tools/wcxhost.exe, in archives that carry it) with Azure Trusted
# Signing (the account that signs WaveCrux), verifies the Authenticode
# signatures, repackages it with tools/release.py and uploads the
# archive as a workflow artifact. A maintainer then regenerates SHA256SUMS
# and catalog.json (tools/release.py finalize) and replaces the three release
# assets. New releases sign in release.yml and never need this.

name: Sign a released Windows library

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. pcie-v0.1.0"
        required: true
        type: string

permissions:
  contents: read

jobs:
  sign:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}

      - name: Download and unpack the released archive
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          plugin="${TAG%-v*}"
          version="${TAG##*-v}"
          echo "PLUGIN=$plugin" >> "$GITHUB_ENV"
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" \
            -p "wcx-$plugin-$version-windows-x64.zip" -D released
          mkdir -p to-sign
          unzip -q "released/wcx-$plugin-$version-windows-x64.zip" -d unpacked
          # The DLL's name comes from plugin.json (pcie-tlp ships wcx_pcie_tlp.dll).
          library=$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["library"])' "decoders/$plugin/plugin.json")
          cp "unpacked/$library.dll" to-sign/
          if [ -f unpacked/tools/wcxhost.exe ]; then cp unpacked/tools/wcxhost.exe to-sign/; fi

      - name: Sign (Azure Trusted Signing)
        uses: azure/trusted-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.AZURE_TS_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.AZURE_TS_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_TS_PROFILE }}
          files-folder: to-sign
          files-folder-filter: dll,exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify the signatures
        shell: pwsh
        run: |
          foreach ($file in Get-ChildItem to-sign -Include *.dll, *.exe -Recurse) {
            $sig = Get-AuthenticodeSignature $file.FullName
            "$($file.Name): $($sig.Status)"
            "  Signer: $($sig.SignerCertificate.Subject)"
            "  Timestamp: $($sig.TimeStamperCertificate.Subject)"
            if ($sig.Status -ne 'Valid') { throw "$($file.Name): signature is $($sig.Status)" }
          }

      - name: Repackage
        shell: bash
        run: |
          python3 tools/release.py package --plugin "$PLUGIN" --platform windows_x64 \
            --build-dir to-sign --out dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-windows
          path: dist/
          if-no-files-found: error

#
# Contributor License Agreement check (CONTRIBUTING.md, CLA.md section 2.1:
# acceptance "through an electronic system Ferrite designates", here this
# bot). On each pull request it checks that every commit author has
# accepted CLA.md; a contributor accepts by commenting the sentence the bot
# asks for, once. Signatures are kept in this repository, on the
# cla-signatures branch (signatures/version1/cla.json), not by a third-party
# service.
#
# pull_request_target runs with the base repository's token so the bot can
# comment and record signatures on pull requests from forks. It never checks
# out or runs the pull request's code.

name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    name: CLA signed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
       (github.event.comment.body == 'recheck' ||
        github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/Ferrite-Engineering/wavecrux-decoders/blob/main/CLA.md
          path-to-signatures: signatures/version1/cla.json
          branch: cla-signatures
          allowlist: martin-robert-fink,dependabot[bot],github-actions[bot]
          lock-pullrequest-aftermerge: false
          custom-notsigned-prcomment: >-
            Thank you for your contribution. Before it can be merged, each commit
            author needs to accept the [EDACrux Contributor License Agreement](https://github.com/Ferrite-Engineering/wavecrux-decoders/blob/main/CLA.md),
            once. You keep the copyright in your work; the agreement grants
            Ferrite Engineering the licence to distribute it (see CONTRIBUTING.md).
            If you contribute on behalf of your employer or another entity, you
            confirm you are authorised to bind it. To accept, comment below with
            exactly the sentence that follows.
          custom-allsigned-prcomment: All commit authors have accepted the CLA. Thank you.
